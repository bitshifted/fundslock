name: Frontend - Build and test pull request

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.0.1'
      - name: Instal dependencies
        run: |
            npm install --legacy-peer-deps
      - name: Build and test
        run: |
          npm run build
