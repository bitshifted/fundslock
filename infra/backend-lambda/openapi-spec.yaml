openapi: 3.0.3
info:
  title: FundsLock API
  description: FundsLock decentralized escrow system API - provides authentication services and agreement tracking via Graph protocol
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/v1/auth/nonce:
    get:
      summary: Create SIWE nonce
      description: Generates a cryptographic nonce for Sign-In with Ethereum (SIWE) authentication flow
      tags:
        - Authentication
      x-amazon-apigateway-integration:
        httpMethod: "GET"
        type: "aws_proxy"
        uri: "${fundslock}"
        payloadFormatVersion: "2.0"
      responses:
        '200':
          description: Nonce generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nonce'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify:
    post:
      summary: Verify SIWE message
      description: Verifies an Ethereum signed message and returns access token along with setting refresh token cookie
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SIWEVerificationRequest'
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        type: "aws_proxy"
        uri: "${fundslock}"
        payloadFormatVersion: "2.0"
      responses:
        '200':
          description: Verification successful, tokens returned
          headers:
            Set-Cookie:
              description: Refresh token HTTP-only cookie
              schema:
                type: string
                example: "refresh_token=<token>; Path=/api/v1/auth/refresh; HttpOnly; SameSite=Lax"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Bad request - invalid signature or message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      description: Uses the refresh token cookie to generate a new access token. May also set a new refresh token cookie if expiration is within 6 hours
      tags:
        - Authentication
      security:
        - cookieAuth: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        type: "aws_proxy"
        uri: "${fundslock}"
        payloadFormatVersion: "2.0"
      responses:
        '200':
          description: Access token refreshed successfully
          headers:
            Set-Cookie:
              description: New refresh token cookie (only if old cookie expires within 6 hours)
              schema:
                type: string
                example: "refresh_token=<token>; Path=/api/v1/auth/refresh; HttpOnly; SameSite=Lax"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Unauthorized - missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/session:
    get:
      summary: Get current session
      description: Retrieves the current user's session data from JWT token claims
      tags:
        - Session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionData'
        '401':
          description: Unauthorized - invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/agreements:
    get:
      summary: Get agreements for wallet
      description: Retrieves all agreements for a specific wallet address on a given blockchain network via Graph protocol
      tags:
        - Agreements
      security:
        - bearerAuth: []
      parameters:
        - name: chain
          in: query
          description: Blockchain network identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agreements retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgreementData'
        '400':
          description: Bad request - missing chain parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Nonce:
      type: object
      properties:
        nonce:
          type: string
          description: Cryptographic nonce for SIWE authentication
      required:
        - nonce

    SIWEVerificationRequest:
      type: object
      properties:
        message:
          type: string
          description: Signed Ethereum message
        signature:
          type: string
          description: Signature of the message
      required:
        - message
        - signature

    AccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
      required:
        - access_token

    SessionData:
      type: object
      properties:
        address:
          type: string
          description: Wallet address
        chainId:
          type: integer
          description: Chain ID
      required:
        - address
        - chainId

    AgreementData:
      type: object
      properties:
        agreement_id:
          type: string
          description: Unique agreement identifier
        seller:
          type: string
          description: Seller wallet address
        buyer:
          type: string
          description: Buyer wallet address
        amount:
          type: string
          description: Agreement amount
        status:
          type: string
          enum:
            - created
            - funded
            - seller_accepted
            - seller_requested_release
            - buyer_approved_release
            - released
            - canceled
          description: Current agreement status
        timestamp:
          type: string
          format: date-time
          description: Agreement creation timestamp
      required:
        - agreement_id
        - seller
        - buyer
        - amount
        - status
        - timestamp

    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
      required:
        - message

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token extracted from Authorization header

    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh token stored as HTTP-only cookie
